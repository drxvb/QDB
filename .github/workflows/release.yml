name: release

# Publishes QDB when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# - Python wheels to PyPI (project quickdb-py) through trusted publishing: no token is stored.
#   One-time setup on pypi.org: add a (pending) trusted publisher for this repository, workflow
#   `release.yml`, environment `pypi`.
# - Rust crates to crates.io (quickdb-api, quickdb-native, quickdb) with the repository secret
#   CARGO_REGISTRY_TOKEN (a crates.io API token with publish-new and publish-update scopes).
#   After the first release, crates.io trusted publishing can replace the token.

on:
  push:
    tags: ["v*"]

env:
  RUST_TOOLCHAIN: "1.91.1"

jobs:
  wheels:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/quickdb-py
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked -o dist
      - name: Test the wheel (native targets only)
        if: matrix.target != 'aarch64' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          python -m pip install pytest numpy
          python -m pip install --no-index --find-links crates/quickdb-py/dist quickdb-py
          python -m pytest -q crates/quickdb-py/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: crates/quickdb-py/dist

  pypi:
    needs: [wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates:
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p quickdb-api -p quickdb-native -p quickdb
