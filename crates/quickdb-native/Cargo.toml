[package]
name = "quickdb-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "QuickDB native backend: SQLite rows and edges plus a persisted pure-Rust HNSW vector index in one embedded store"
repository.workspace = true
publish = false
keywords = ["database", "vector-search", "hnsw", "graph", "embedded"]
categories = ["database-implementations", "data-structures"]
readme = "README.md"
# Keep run logs and evidence out of the package. tests/fixtures/corpus-shapes.tsv stays in: a unit
# test reads it with include_str!. Examples excluded: qbench and point_retained call quickdb-bench,
# a path dev-dependency that packaging strips; bound_reference regenerates a frozen fixture by
# compiling src/hnsw.rs a second time, and without the workspace's release profile (thin LTO),
# which packaging drops, its #[no_mangle] counter is a duplicate symbol at link time.
exclude = [
    "evidence/",
    "*.log",
    "examples/qbench.rs",
    "examples/point_retained.rs",
    "examples/bound_reference.rs",
]

[dependencies]
quickdb-api = { path = "../quickdb-api", version = "0.1.0" }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
crc32fast = "1.5"

[dev-dependencies]
sha2 = "0.10"
tempfile = "3"
quickdb-bench = { path = "../quickdb-bench" }
