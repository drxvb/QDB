[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "quickdb-py"
version = "0.1.0"
description = "QDB (QuickDB): relational rows, vectors and a graph in one embedded, in-process store"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Rabie Qotb" }, { name = "Basil" }]
keywords = ["database", "vector-search", "hnsw", "graph", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Typing :: Typed",
]
# numpy is optional: any 2-D float buffer works, and so do plain lists.
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.21"]
test = ["pytest>=7", "numpy>=1.21"]

[project.urls]
Repository = "https://github.com/drxvb/QDB"

[tool.maturin]
python-source = "python"
module-name = "quickdb._quickdb"
bindings = "pyo3"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
