[package]
name = "quickdb-py"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Rabie Qotb", "Basil"]
description = "Python bindings for QDB (QuickDB): relational rows, vectors and a graph in one embedded store"
repository = "https://github.com/drxvb/QDB"
readme = "README.md"
publish = false

# Its own cargo workspace: the extension module is built by maturin, outside the main workspace.
[workspace]

[lib]
name = "_quickdb"
crate-type = ["cdylib"]

[dependencies]
# abi3-py39: one wheel per platform for CPython 3.9 and later.
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
quickdb-api = { path = "../quickdb-api" }
quickdb-native = { path = "../quickdb-native" }
# Same version as quickdb-native, so cargo unifies it (and its bundled SQLite). Used only to read the store's
# persisted table definitions read-only; see `read_schema` in src/lib.rs.
rusqlite = "0.43"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
