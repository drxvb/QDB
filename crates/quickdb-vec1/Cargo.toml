[package]
name = "quickdb-vec1"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
build = "build.rs"

[workspace]

[dependencies]
quickdb-api = { path = "../quickdb-api" }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
# Direct dependency only so that build.rs receives DEP_SQLITE3_INCLUDE (the bundled headers).
libsqlite3-sys = "0.40"

[build-dependencies]
cc = "1"
sha2 = "0.10"

[dev-dependencies]
quickdb-bench = { path = "../quickdb-bench" }
tempfile = "3"

# Same release profile as the root workspace, so that the comparison is like for like.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1
